<script>
/* ===== 설정: Supabase (시연용 합성 데이터 전용) =====
   publishable 키는 공개되어도 되는 키이지만, 이 프로젝트의 wf_ 테이블은 시연용으로 누구나 읽고 쓸 수 있게 열려 있다.
   실제 개인정보를 넣지 말 것. 행정망 안에서는 외부 클라우드를 쓸 수 없으므로 내부 DB로 이전해야 한다. */
const SUPABASE_URL = 'https://naptmidzrudyezlegtgz.supabase.co';
const SUPABASE_KEY = 'sb_publishable_8fv7f3vSQoDK67lsflICeA__wgFlpCa';
const ME = { ref: 'citizen-0001', name: '홍길동(합성)', birth: '1980-01-01', phone: '010-****-5678', email: 'hong***@example.com', consent: { sms: true, email: true } };
const WRONG_MSG = '첨부한 서류가 해당 서류와 맞지 않습니다. 올바른 서류를 첨부해 주세요.';
const KIND = { manual: '현장 작성', gov24: '정부24 연계', upload: '직접 첨부' };
/* AI Double Check 판독 엔진 (welfare_ai/src/server.py). 켜져 있으면 파일 내용을 실제로 판독하고,
   꺼져 있으면 기존 시연 방식(파일 이름 키워드)으로 동작한다. */
const ENGINE_URL = 'http://127.0.0.1:8787';
const ROLE_SEQ = { '접수': 0, '심사': 1, '승인': 2 };
const SEV = { high: ['red', '높음'], medium: ['amber', '중간'], low: ['', '낮음'], info: ['', '참고'] };

async function api(path, opt) {
  opt = opt || {};
  const res = await fetch(SUPABASE_URL + '/rest/v1/' + path, {
    method: opt.method || 'GET',
    headers: Object.assign({ apikey: SUPABASE_KEY, 'Content-Type': 'application/json', Prefer: 'return=representation' }, opt.headers || {}),
    body: opt.body ? JSON.stringify(opt.body) : undefined
  });
  if (!res.ok) { throw new Error('DB 오류 ' + res.status + ': ' + (await res.text()).slice(0, 200)); }
  return res.status === 204 ? null : res.json();
}
async function engine(path, body) {
  const res = await fetch(ENGINE_URL + path, body ? { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) } : {});
  const j = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(j.error || ('판독 엔진 오류 ' + res.status));
  return j;
}
async function checkEngine() {
  try {
    const ctl = new AbortController(); const t = setTimeout(() => ctl.abort(), 1500);
    const r = await fetch(ENGINE_URL + '/api/health', { signal: ctl.signal }); clearTimeout(t);
    S.engine = r.ok ? await r.json() : false;
  } catch (e) { S.engine = false; }
}
const toB64 = (file) => new Promise((ok, no) => { const r = new FileReader(); r.onload = () => ok(String(r.result).split(',')[1] || ''); r.onerror = () => no(new Error('파일을 읽지 못했습니다.')); r.readAsDataURL(file); });
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmtDate = (t) => { if (!t) return '-'; const d = new Date(t); if (isNaN(d)) return '-'; return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); };
const $ = (id) => document.getElementById(id);

const S = {
  role: 'citizen', step: 'list', cat: '전체', procId: null, dept: null, staffSeq: 0,
  procs: [], pdocs: {}, cases: [], openId: null, toast: '', busy: false,
  att: {}, attCount: {}, attMsg: {}, modal: null, engine: false
};

/* ===== 데이터 ===== */
async function loadAll() {
  const [procs, pdocs, cases, lines] = await Promise.all([
    api('wf_procedures?select=*&order=sort'),
    api('wf_proc_docs?select=*&order=sort'),
    api('wf_cases?select=*,wf_case_docs(*)&order=created_at.desc'),
    api('wf_approval_line?select=*&order=seq')
  ]);
  S.lines = {};
  lines.forEach((l) => { (S.lines[l.proc_id] = S.lines[l.proc_id] || []).push(l); });
  S.procs = procs;
  S.pdocs = {};
  pdocs.forEach((d) => { (S.pdocs[d.proc_id] = S.pdocs[d.proc_id] || []).push(d); });
  S.cases = cases;
  S.dbReady = true;
  const scopes = WF.scopes(S.lines);
  if (!scopes.some(x => x.dept === S.dept && x.seq === S.staffSeq)) { const first = scopes[0]; S.dept = first ? first.dept : null; S.staffSeq = first ? first.seq : 0; }
}
const proc = (id) => S.procs.find((p) => p.id === id);
const depts = () => Array.from(new Set(S.procs.map((p) => p.dept)));
const nonManual = (pid) => (S.pdocs[pid] || []).filter((d) => d.kind !== 'manual');
const avgOf = (arr) => arr.length ? Math.round(arr.reduce((a, b) => a + b, 0) / arr.length) : 0;

function computeReasons(blind, docs, defs) {
  const r = [];
  if (blind) r.push(blind);
  const mism = docs.filter((d) => d.state === 'mismatch');
  if (mism.length) r.push('정부24 대조 불일치: ' + mism.map((d) => (defs.find((x) => x.doc_id === d.doc_id) || {}).name).join(', '));
  const avg = avgOf(docs.map((d) => d.sim || 0));
  const low = docs.filter((d) => (d.sim || 0) < 80).map((d) => (defs.find((x) => x.doc_id === d.doc_id) || {}).name);
  if (docs.length && avg < 80) r.push('서류 불일치 의심: ' + low.join(', '));
  return { reasons: r, avg: avg };
}
const group = (c) => (c.status === '완료' || c.status === '반려') ? 'done' : (c.reasons && c.reasons.length ? 'review' : 'fit');
const statusChip = (c, forCitizen) => {
  const m = { '접수': 'blue', '체크완료': 'blue', 'AI심사': 'amber', 'VALI오류': 'red', '완료': 'green', '반려': 'red' };
  return '<span class="chip ' + (forCitizen && c.status === 'VALI오류' ? 'amber' : (m[c.status] || '')) + '">' + esc(c.status === 'AI심사' ? '심사중' : c.status === 'VALI오류' ? (forCitizen ? '최종 심사중' : '오류') : c.status) + '</span>';

async function attachFile(docId, file) {
  const p = proc(S.procId); const d = (S.pdocs[p.id] || []).find((x) => x.doc_id === docId);
  if (S.engine) {
    S.attMsg[docId] = '판독 중…'; render();
    try {
      const data = await toB64(file);
      const r = await engine('/api/check-doc', { proc_id: p.id, doc_id: docId, filename: file.name, data: data });
      S.att[docId] = { fname: file.name, sim: r.sim, state: r.state, data: data, readBy: r.read_by };
      S.attMsg[docId] = r.state === 'wrong' ? WRONG_MSG + (r.detected_type ? ' (판독 결과: ' + r.detected_type + ')' : '') :
        (r.suspicious && r.suspicious.length ? '서류 안에 판독을 조작하려는 듯한 문장이 있어 담당자가 확인합니다.' : '');
    } catch (e) { S.att[docId] = null; S.attMsg[docId] = e.message; }
    return;
  }
  const fname = file.name; const hit = (d.keys || []).some((k) => fname.indexOf(k) >= 0);
  S.attCount[docId] = (S.attCount[docId] || 0) + 1;
  let sim, state, msg = '';
  if (!hit) { sim = 28; state = 'wrong'; msg = WRONG_MSG; }
  else if (d.kind === 'gov24' && d.diff && S.attCount[docId] === 1) { sim = d.good; state = 'mismatch'; msg = '정부24 연계 값과 다릅니다: ' + d.diff + ' 같은 서류를 다시 첨부하면 확인을 이어갑니다.'; }
  else { sim = d.good; state = 'ok'; }
  S.att[docId] = { fname, sim, state }; S.attMsg[docId] = msg;
}

async function submitCase() {
  const p = proc(S.procId); const need = nonManual(p.id);
  S.busy = true; render();
  if (S.engine) {
    const docs = {}; need.forEach((d) => { const a = S.att[d.doc_id]; if (a && a.data) docs[d.doc_id] = { filename: a.fname, data: a.data }; });
    let res;
    try { res = await engine('/api/check-case', { proc_id: p.id, docs: docs }); } finally { S.busy = false; }
    const rows = need.map((d) => ({ doc_id: d.doc_id, sim: (res.docs[d.doc_id] || {}).sim || 0, state: (res.docs[d.doc_id] || {}).state || 'missing', fname: S.att[d.doc_id] ? S.att[d.doc_id].fname : null }));
    const id = 'app_' + Date.now().toString(36);
    await insertCase({ id: id, proc_id: p.id, applicant_name: ME.name, applicant_ref: ME.ref, birth: ME.birth, form_name: p.form_name, blind: '', avg: avgOf(rows.map((x) => x.sim)), reasons: findingReasons(res.findings), findings: res.findings });
    await api('wf_case_docs', { method: 'POST', body: rows.map((x) => Object.assign({ case_id: id }, x)) });
    S.att = {}; S.attCount = {}; S.attMsg = {}; S.step = 'mine'; S.myOpen = id;
    S.toast = '기안이 제출되었습니다. 서류 점검 결과는 담당자가 확인합니다.' + (S.noFindingsCol ? ' (DB에 점검 결과 칸이 없어 요약만 저장했습니다: sql/002 적용 필요)' : '');
    await refresh(); return;
  }
  const rows = need.map((d) => ({ doc_id: d.doc_id, sim: S.att[d.doc_id].sim, state: S.att[d.doc_id].state === 'mismatch' ? 'mismatch' : 'ok', fname: S.att[d.doc_id].fname }));
  const r = computeReasons('', rows, need);
  const id = 'app_' + Date.now().toString(36);
  await api('wf_cases', { method: 'POST', body: { id: id, proc_id: p.id, applicant_name: ME.name, applicant_ref: ME.ref, birth: ME.birth, form_name: p.form_name, blind: '', avg: r.avg, reasons: r.reasons } });
  await api('wf_case_docs', { method: 'POST', body: rows.map((x) => Object.assign({ case_id: id }, x)) });
  S.att = {}; S.attCount = {}; S.attMsg = {}; S.busy = false; S.step = 'mine'; S.myOpen = id;
  S.toast = '기안이 제출되었습니다. 진행 상태는 “내 신청함”에서 확인할 수 있습니다.';
  await refresh();
}

    const pid = $('f-form').value; const p = proc(pid); const low = $('f-low') && $('f-low').checked;
    const need = nonManual(pid); const rows = need.map((d) => ({ doc_id: d.doc_id, sim: low ? 58 : 95, state: low ? 'wrong' : 'ok' }));
    const r = computeReasons(blind, rows, need);
    const nid = 'reg_' + Date.now().toString(36);
    await api('wf_cases', { method: 'POST', body: { id: nid, proc_id: pid, applicant_name: name, applicant_ref: 'registered', birth: birth, form_name: p.form_name, blind: blind, avg: r.avg, reasons: r.reasons } });
    await api('wf_case_docs', { method: 'POST', body: rows.map((x) => Object.assign({ case_id: nid }, x)) });
  }
  S.modal = null; S.toast = '저장되었습니다.'; await refresh();
}

document.addEventListener('click', (ev) => {
  const t = ev.target.closest('[data-act]'); if (!t || t.tagName === 'INPUT') return;
  const a = t.dataset.act, v = t.dataset.v;
  if(!S.dbReady&&!['botopen','botclose','botconsent','botsend','botchip','botllm','reload'].includes(a))return;
  S.toast = '';
  if (a === 'role') { if(v!=='citizen'&&v!=='staff')return; S.role=v; S.openId=null;S.modal=null; render(); }
  else if(a==='staff-scope'){if(S.role!=='staff')return;const s=WF.scopes(S.lines)[Number(v)];if(!s)return;S.dept=s.dept;S.staffSeq=s.seq;S.openId=null;S.modal=null;render();}
  else if (a === 'cat') { S.cat = v; render(); }
  else if (a === 'home') { S.step = 'list'; S.bot.pid=null;S.bot.pending=null; render(); }
  else if (a === 'mine') run(async () => { S.step = 'mine'; S.myOpen = null; await refresh(); });
  else if (a === 'reload') run(refresh);
  else if (a === 'reqview') run(async () => { await api('wf_view_log', { method: 'POST', body: { case_id: v, doc_id: '*', dept: '열람요청(기안자)' }, headers: { Prefer: 'return=minimal' } }); S.toast = '서류 열람 요청이 접수되었습니다. 담당 부서가 확인한 뒤 안내해 드립니다.'; });
  else if (a === 'mdetail') { S.myOpen = S.myOpen === v ? null : v; render(); }
  else if (a === 'mfilter') { const fs = $('f-s').value, fe = $('f-e').value, fq = $('f-q').value.trim(); if (fs && fe && fs > fe) { $('mine-err').innerHTML = '<div class="notice err" role="alert">시작일자가 마감일자보다 늦습니다. 기간을 다시 선택해 주세요.</div>'; return; } S.fs = fs; S.fe = fe; S.fq = fq; S.af = { s: fs, e: fe, q: fq }; S.myOpen = null; render(); }
  else if (a === 'mreset') { S.fs = ''; S.fe = ''; S.fq = ''; S.af = { s: '', e: '', q: '' }; S.myOpen = null; render(); }
  else if (a === 'guide') { ev.preventDefault(); S.procId = v; S.step = 'guide'; botOnGuide(v); S.recent = [v].concat((S.recent || []).filter((x) => x !== v)).slice(0, 5); render(); }
  else if (a === 'botopen') { if(S.role==='citizen'){botOpen();renderBot();} }
  else if (a === 'botclose') { S.bot.open = false; renderBot(); }
  else if (a === 'botconsent') { if(S.role==='citizen'&&['sms','email'].includes(v)){ME.consent[v]=!ME.consent[v];renderBot();} }
  else if (a === 'botllm') botToggleLLM();
  else if (a === 'botsend') {const i=$('bot-in');botSubmit(i?i.value:'');}
  else if (a === 'botchip') botChip(v);
  else if (a === 'search') { S.q = ($('q-input') || {}).value || ''; render(); }
  else if (a === 'sort') { S.sort = v; render(); }
  else if (a === 'apply') { S.att = {}; S.attCount = {}; S.attMsg = {}; S.step = 'apply'; render(); }
  else if (a === 'submit') run(submitCase);
  else if (a === 'detail') { if(!staffAct(getCase(v)))return; S.openId = S.openId === v ? null : v; render(); }
  else if (a === 'approve') run(() => approve(v));
  else if (a === 'reject') run(() => rejectCase(v));
  else if (a === 'revali') run(() => revalidateCase(v));
  else if (a === 'new') { if(!staffIntake())return;S.formErr = ''; S.modal = { type: 'new' }; render(); }
  else if (a === 'edit') { if(!staffEdit(getCase(v)))return; S.formErr = ''; S.modal = { type: 'edit', id: v }; render(); }
  else if (a === 'del') { const c=getCase(v);if(!staffEdit(c))return; S.modal = { type: 'del', id: v, name: c.applicant_name + ' · ' + c.form_name }; render(); }
  else if (a === 'delok') run(async () => { requireStaff(staffEdit(getCase(v)));const r=await api('wf_cases?id=eq.'+encodeURIComponent(v)+'&stage=eq.0&status=eq.'+encodeURIComponent('접수'),{method:'DELETE'});if(!Array.isArray(r)||r.length!==1)throw new Error('삭제되지 않았습니다. 상태를 새로고침하세요.');S.modal=null;S.openId=null;S.toast='삭제되었습니다.';await refresh(); });
  else if (a === 'save') run(() => saveForm(v));
  else if (a === 'close') { S.modal = null; render(); }
  else if (a === 'view') run(async () => {
 const cid=t.dataset.c;requireStaff(staffDoc(getCase(cid),v));
 const scope=staffScope();
 await api('wf_view_log',{method:'POST',body:{case_id:cid,doc_id:v,dept:scope.dept},headers:{Prefer:'return=minimal'}});
 if(S.dept===scope.dept&&S.staffSeq===scope.seq&&staffDoc(getCase(cid),v))S.modal={type:'view',c:cid,d:v};
 });
});
document.addEventListener('input', ev=>{if(ev.target?.id==='bot-in')S.bot.draft=ev.target.value;});
document.addEventListener('change', (ev) => {
  if (ev.target.id === 'lim') { S.limit = parseInt(ev.target.value, 10); render(); return; }
  const t = ev.target; if (t.dataset && t.dataset.act === 'file' && t.files[0]) { attachFile(t.dataset.v, t.files[0]).then(render); }
});
document.addEventListener('keydown', (ev) => { if (ev.target && ev.target.id === 'q-input' && ev.key === 'Enter') { S.q = ev.target.value; render(); return; } if (ev.target && ev.target.id === 'bot-in' && ev.key === 'Enter') { if(ev.isComposing||ev.keyCode===229)return;ev.preventDefault();botSubmit(ev.target.value);return; } if (S.modal && S.modal.type === 'view' && (ev.ctrlKey || ev.metaKey) && /^[cpsa]$/i.test(ev.key)) ev.preventDefault(); });
document.addEventListener('copy', (ev) => { if (S.modal && S.modal.type === 'view') ev.preventDefault(); });

(async function init() {
  renderBot();
  await checkEngine();
  try { await loadAll(); } catch (e) { S.dbReady=false; $('app').innerHTML = '<div class="notice err">DB에 연결하지 못했습니다. 신청 도우미의 시연용 안내는 이용할 수 있습니다.</div><button class="btn" data-act="reload">다시 연결</button>'; renderBot(); return; }
  render();
})();
</script>
